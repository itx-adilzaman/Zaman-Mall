<body>
  <div id="scroll-progress"></div>
  <div id="root"></div>
  <script>
    // Tech Scroll Progress Bar Animations
    const progressBar = document.getElementById('scroll-progress');
    let isScrolling = false;
    let scrollTimeout;

    function updateProgress() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollProgress = (scrollTop / scrollHeight) * 100;
      
      progressBar.style.width = scrollProgress + '%';
      
      // Add scrolling class for animation
      progressBar.classList.add('scrolling');
      
      // Add complete class when at bottom
      if (scrollProgress >= 95) {
        progressBar.classList.add('complete');
      } else {
        progressBar.classList.remove('complete');
      }
      
      // Clear scrolling class after scroll ends
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        progressBar.classList.remove('scrolling');
        isScrolling = false;
      }, 150);
      
      isScrolling = true;
    }

    // Initialize
    updateProgress();
    window.addEventListener('scroll', updateProgress);
    window.addEventListener('resize', updateProgress);
  </script>
